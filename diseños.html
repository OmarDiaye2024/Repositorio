<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portafolio | Omar</title>
    <meta name="description" content="Portafolio de Omar Diaye - Diseño 3D, audiovisual, editorial e identidad de marca.">

    <link rel="icon" href="img/Icono.ico">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
</head>

<body>


<main>

<!-- DISEÑOS 3D -->
<section id="Diseños3D" class="portfolio">
    <div class="contenido-seccion">
        <h2>Diseños 3D</h2>

        <div class="galeria">
            <article class="proyecto">
                <img src="img/Montaña 3d.png" alt="Diseño 3D 1" loading="lazy">
            </article>

            <article class="proyecto">
                <img src="img/Montañas en blender(por mi) liviana.png" alt="Diseño 3D 2" loading="lazy">
            </article>

            <article class="proyecto">
                <video autoplay loop muted>
                    <source src="Videos/8.mkv" type="video/mp4">
                </video>
            </article>
        </div>
    </div>
</section>

<!-- AUDIOVISUAL -->
<section id="Audiovisual" class="portfolio">
    <div class="contenido-seccion">
        <h2>Diseño Audiovisual</h2>

        <div class="galeria">
            <article class="proyecto"><video controls><source src="Videos/1.mp4"></video></article>
            <article class="proyecto"><video controls><source src="Videos/2.m4v"></video></article>
            <article class="proyecto"><video controls><source src="Videos/3.m4v"></video></article>
            <article class="proyecto"><video controls><source src="Videos/4.mp4"></video></article>
            <article class="proyecto"><video controls><source src="Videos/6.m4v"></video></article>
            <article class="proyecto"><video controls><source src="Videos/7.m4v"></video></article>
        </div>
    </div>
</section>

<!-- EDITORIAL -->
<section id="Editorial" class="portfolio">
    <div class="contenido-seccion">
        <h2>Diseño Editorial</h2>

        <div class="galeria">
            <article class="proyecto"><img src="editorial/Poster_1.png" loading="lazy"></article>
            <article class="proyecto"><img src="editorial/Poster_2.png" loading="lazy"></article>
            <article class="proyecto"><img src="editorial/Artboard 11.png" loading="lazy"></article>
            <article class="proyecto"><img src="editorial/Artboard 21.png" loading="lazy"></article>
        </div>
    </div>
</section>

<!-- MARCA -->
<section id="DiseñoDeMarca" class="portfolio">
    <div class="contenido-seccion">
        <h2>Identidad Marcaria</h2>

        <div class="galeria">
            <article class="proyecto"><img src="marca/Cartel 1.png" loading="lazy"></article>
            <article class="proyecto"><img src="marca/cartel 2.png" loading="lazy"></article>
            <article class="proyecto"><img src="marca/Cartel 3.png" loading="lazy"></article>
            <article class="proyecto"><img src="marca/TICKETS.png" loading="lazy"></article>
        </div>
    </div>
</section>

</main>

<footer class="footer">
  <div class="footer-socials">
    <a href="https://www.linkedin.com/in/omar-diaye-6421891b3/" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-linkedin-in"></i>
    </a>
    <a href="https://github.com/OmarDiaye2024" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-github"></i>
    </a>
    <a href="https://www.instagram.com/evans_aravar/" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-instagram"></i>
    </a>
  </div>

  <p class="footer-copy">
    © 2026 · Omar Diaye
  </p>
</footer>

<!-- MODAL -->
<div id="imgModal" class="img-modal">
    <span class="cerrar">&times;</span>
    <img class="img-modal-contenido" id="imgAmpliada">
</div>

<script src="script.js"></script>
</body>
</html>
